<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Workout Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Auth Section (Login/Register) -->
    <div id="auth-section" class="section">
      <h1>Gym Workout Tracker</h1>
      
      <!-- Login Form -->
      <div id="login-form" class="form-container">
        <h2>Login</h2>
        <form id="loginForm">
          <input type="text" id="login-username" placeholder="Username" required>
          <input type="password" id="login-password" placeholder="Password" required>
          <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="#" id="show-register">Register here</a></p>
      </div>

      <!-- Register Form -->
      <div id="register-form" class="form-container hidden">
        <h2>Register</h2>
        <form id="registerForm">
          <input type="text" id="register-username" placeholder="Username" required>
          <input type="email" id="register-email" placeholder="Email" required>
          <input type="password" id="register-password" placeholder="Password" required>
          <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="#" id="show-login">Login here</a></p>
      </div>
    </div>

    <!-- Main App Section (Workout Tracker) -->
    <div id="app-section" class="section hidden">
      <div class="header">
        <h1>My Workouts</h1>
        <div class="user-info">
          <span id="username-display"></span>
          <button id="logout-btn" class="btn-secondary">Logout</button>
        </div>
      </div>

      <!-- Add Workout Form -->
      <div class="add-workout">
        <h2>Log New Workout</h2>
        <form id="workoutForm">
          <div class="form-row">
            <input type="text" id="exercise-name" placeholder="Exercise Name" required>
            <input type="number" id="sets" placeholder="Sets" min="0">
            <input type="number" id="reps" placeholder="Reps" min="0">
          </div>
          <div class="form-row">
            <input type="number" id="weight" placeholder="Weight (lbs/kg)" step="0.5" min="0">
            <input type="number" id="duration" placeholder="Duration (min)" min="0">
            <input type="date" id="workout-date">
          </div>
          <textarea id="notes" placeholder="Notes (optional)" rows="2"></textarea>
          <button type="submit">Log Workout</button>
        </form>
      </div>

      <!-- Workouts List -->
      <div class="workouts-list">
        <h2>Recent Workouts</h2>
        <div id="workouts-container"></div>
      </div>
    </div>

    <!-- Message Display -->
    <div id="message" class="message hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
